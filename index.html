<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutrify</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; position: relative; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    
    /* यह कोड 'Made with Figma' बैज को छिपा देगा */
    .badge-cover {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 170px;
      height: 60px;
      background: #ffffff;
      z-index: 9999999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe src="https://katee-8rmr55yd4s.figweb.site/" allowfullscreen></iframe>
  <div class="badge-cover"></div>
</body>
</html>
